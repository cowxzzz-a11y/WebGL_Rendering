<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#15110e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>五曜罗盘</title>
    <link rel="stylesheet" href="./styles.css?v=20260716-8" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="gameCanvas" aria-label="五曜罗盘游戏画面"></canvas>

      <header class="hud hud-top">
        <div class="brand">
          <span class="brand-mark">◉</span>
          <div>
            <p class="eyebrow">TILT · AWAKEN</p>
            <h1>五曜罗盘</h1>
          </div>
        </div>
        <div class="progress" aria-live="polite">
          <span class="progress-label">已唤醒</span>
          <strong id="score">0 / 4</strong>
        </div>
      </header>

      <section id="intro" class="panel intro-panel">
        <span class="panel-ornament">✦</span>
        <p class="eyebrow">MOBILE MOTION GAME</p>
        <h2>倾斜手机，唤醒四曜</h2>
        <p>操控中央的银灰灵珠，撞击固定在罗盘上的四颗金色曜珠。</p>
        <button id="motionButton" class="primary-button" type="button">开启重力感应</button>
        <button id="startButton" class="text-button" type="button">先用触控体验</button>
        <small id="sensorHint">首次点击后，iPhone 会请求「动作与方向」权限。</small>
      </section>

      <section id="complete" class="panel complete-panel" aria-live="polite" hidden>
        <span class="panel-ornament">✦</span>
        <p class="eyebrow">ALL AWAKENED</p>
        <h2>四曜已苏醒</h2>
        <p>这一局罗盘已被点亮。</p>
        <button id="againButton" class="primary-button" type="button">再开一局</button>
      </section>

      <div id="touchHint" class="touch-hint" hidden>拖动屏幕即可引导灵珠</div>
      <div id="renderError" class="render-error" role="alert" hidden>
        <strong>罗盘未能启动</strong>
        <span>请刷新页面后重试；若仍出现，请截屏发我。</span>
      </div>

      <div class="hud hud-bottom">
        <div class="utility-actions">
          <button id="autoPlayButton" class="round-button auto-play-button" type="button" aria-label="自动演示" title="自动演示" aria-pressed="false">
            <span>▶</span>
          </button>
          <button id="recenterButton" class="round-button" type="button" aria-label="重新校准重力感应" title="重新校准">
            <span>⊙</span>
          </button>
        </div>
        <button id="restartButton" class="restart-button" type="button">
          <span class="restart-icon">↻</span>
          <span>重开</span>
        </button>
      </div>

      <section class="physics-rails" aria-label="物理参数调节">
        <aside class="physics-rail physics-rail-left">
          <p class="eyebrow">MOTION</p>
          <label class="range-control" for="tiltForce"><span>倾斜力 <output id="tiltForceValue">8.0</output></span><input id="tiltForce" type="range" min="2" max="12" step="0.2" value="8.0" /></label>
          <label class="range-control" for="rollingDamping"><span>滚动阻尼 <output id="rollingDampingValue">0.3</output></span><input id="rollingDamping" type="range" min="0.1" max="5" step="0.1" value="0.3" /></label>
        </aside>
        <aside class="physics-rail physics-rail-right">
          <p class="eyebrow">COLLISION</p>
          <label class="range-control" for="maxSpeed"><span>最高速度 <output id="maxSpeedValue">7.0</output></span><input id="maxSpeed" type="range" min="2" max="10" step="0.2" value="7.0" /></label>
          <label class="range-control" for="edgeBounce"><span>边界弹性 <output id="edgeBounceValue">0.58</output></span><input id="edgeBounce" type="range" min="0" max="1" step="0.02" value="0.58" /></label>
          <label class="range-control" for="targetBounce"><span>撞击弹性 <output id="targetBounceValue">0.42</output></span><input id="targetBounce" type="range" min="0" max="1" step="0.02" value="0.42" /></label>
        </aside>
      </section>
      <section id="landscapeNotice" class="landscape-notice" aria-live="polite"><span>↻</span><strong>请将手机横向握持</strong><small>横屏后即可使用重力感应操控罗盘</small></section>
    </main>

    <script>
      window.addEventListener('error', () => {
        const message = document.getElementById('renderError');
        if (message) message.hidden = false;
      }, true);
    </script>
    <script src="./vendor/babylon.js?v=20260716-8"></script>
    <script src="./game.js?v=20260716-8"></script>
  </body>
</html>
